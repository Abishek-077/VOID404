version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:14-alpine
    container_name: academic-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: academic_analyzer_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - academic-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: academic-redis
    ports:
      - "6379:6379"
    networks:
      - academic-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: academic-backend
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/academic_analyzer_dev
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-services:8000
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres
      - redis
    networks:
      - academic-network

  # AI Services
  ai-services:
    build:
      context: ./ai-services
      dockerfile: ../docker/ai-services.Dockerfile
    container_name: academic-ai
    ports:
      - "8000:8000"
    volumes:
      - ./ai-services:/app
    networks:
      - academic-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: academic-frontend
    environment:
      - REACT_APP_API_URL=http://localhost:5000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - academic-network

networks:
  academic-network:
    driver: bridge

volumes:
  postgres_data:
